<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Birthday Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Poppins', sans-serif; overflow: hidden; }
        .hidden-view { display: none !important; }
        .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #panda { font-size: 80px; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .neon-border { border: 1px solid #38bdf8; box-shadow: 0 0 15px #38bdf8; }
    </style>
</head>
<body>

    <!-- 1. LOCK SCREEN -->
    <div id="lock" class="center">
        <div onclick="startFlow()" class="w-24 h-24 bg-blue-500 rounded-full cursor-pointer neon-border"></div>
        <p class="mt-4 animate-pulse">Tap to Unlock Surprise</p>
    </div>

    <!-- 2. LOADING PANDA -->
    <div id="loading" class="hidden-view center">
        <div id="panda">🐼</div>
        <p class="mt-4">Loading something for you...</p>
        <div class="w-48 h-2 bg-gray-800 mt-4 rounded-full overflow-hidden">
            <div id="bar" class="h-full bg-blue-500 w-0 transition-all duration-[3000ms]"></div>
        </div>
    </div>

    <!-- 3. COUNTDOWN -->
    <div id="countdown" class="hidden-view center">
        <h1 id="count" class="text-9xl font-bold text-blue-400">10</h1>
    </div>

    <!-- 4. PHOTO SLIDER -->
    <div id="photos" class="hidden-view center p-6">
        <h2 class="text-xl mb-6 text-blue-300">Special Memories</h2>
        <div class="w-64 h-64 bg-gray-800 rounded-2xl mb-6 flex items-center justify-center neon-border">
            <img id="slide-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400" class="w-full h-full object-cover rounded-2xl">
        </div>
        <button onclick="showLetter()" class="bg-blue-600 px-8 py-3 rounded-full">Next</button>
    </div>

    <!-- 5. LOVE LETTER -->
    <div id="letter" class="hidden-view center p-8 text-center">
        <div id="heart" onclick="revealLetter()" class="text-7xl cursor-pointer hover:scale-110 transition">❤️</div>
        <p id="msg" class="hidden-view mt-6 italic text-blue-200">"You are the most special person in my life. Happy Birthday!"</p>
        <button id="celebrate-btn" onclick="celebrate()" class="hidden-view mt-8 bg-red-600 px-8 py-3 rounded-full animate-pulse">CELEBRATE</button>
    </div>

    <script>
        function startFlow() {
            document.getElementById('lock').classList.add('hidden-view');
            document.getElementById('loading').classList.remove('hidden-view');
            document.getElementById('bar').style.width = '100%';
            
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden-view');
                document.getElementById('countdown').classList.remove('hidden-view');
                let count = 10;
                let timer = setInterval(() => {
                    count--;
                    document.getElementById('count').innerText = count;
                    if(count <= 0) {
                        clearInterval(timer);
                        document.getElementById('countdown').classList.add('hidden-view');
                        document.getElementById('photos').classList.remove('hidden-view');
                    }
                }, 1000);
            }, 3000);
        }

        function showLetter() {
            document.getElementById('photos').classList.add('hidden-view');
            document.getElementById('letter').classList.remove('hidden-view');
        }

        function revealLetter() {
            document.getElementById('msg').classList.remove('hidden-view');
            document.getElementById('celebrate-btn').classList.remove('hidden-view');
        }

        function celebrate() {
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
        }
    </script>
</body>
</html>
