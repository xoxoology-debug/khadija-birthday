<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Happy Birthday - React Premium</title>
    
    <!-- 1. Tailwind CSS v4 Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- 2. React core libraries & Babel Compiler (FREE CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Confetti Effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #0d0204;
            color: #f3e8e8;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .serif-font { font-family: 'Playfair Display', serif; }
        
        /* Premium Glassmorphism Panel */
        .glass-panel {
            background: linear-gradient(135deg, rgba(25, 10, 12, 0.85) 0%, rgba(15, 5, 7, 0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(235, 68, 90, 0.25);
            box-shadow: 0 0 35px rgba(213, 31, 55, 0.2), inset 0 0 15px rgba(255,255,255,0.02);
        }
        
        /* Button Glow & Feedback States */
        .key-btn {
            background: rgba(30, 12, 14, 0.6);
            border: 1px solid rgba(235, 68, 90, 0.15);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: manipulation;
        }
        .key-btn:active {
            transform: scale(0.92);
            background: rgba(235, 68, 90, 0.35);
            box-shadow: 0 0 15px rgba(235, 68, 90, 0.5);
        }

        /* React Split Curtain System */
        .curtain-container {
            position: fixed;
            inset: 0;
            display: flex;
            z-index: 100;
            pointer-events: none;
        }
        .curtain-panel {
            width: 50%;
            height: 100%;
            background: radial-gradient(circle at center, #230509 0%, #070102 100%);
            border: 1px solid rgba(235, 68, 90, 0.1);
            transition: transform 1.4s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .curtain-left { transform-origin: left; }
        .curtain-right { transform-origin: right; }
        
        /* Active opened states compiled by React State */
        .curtain-opened .curtain-left { transform: translateX(-100%); }
        .curtain-opened .curtain-right { transform: translateX(100%); }

        /* Animation Framework Injectors */
        .react-fade-in {
            animation: reactFadeIn 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes reactFadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-4 select-none relative overflow-hidden">

    <!-- Root target container for React Application injection -->
    <div id="react-birthday-root" class="w-full h-full flex items-center justify-center"></div>

    <!-- Live React Script Engine compiled via Babel -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        function BirthdayPremiumApp() {
            // Functional React States mapping exactly to original UI logic
            const [passkey, setPasskey] = useState("");
            const [isUnlocked, setIsUnlocked] = useState(false);
            const [currentView, setCurrentView] = useState("loading"); // loading, intro, age, memories, letter
            const [memoryIndex, setMemoryIndex] = useState(0);
            const [showHint, setShowHint] = useState(false);
            const [letterOpened, setLetterOpened] = useState(false);

            const CORRECT_PASSKEY = "2026";
            
            const memoriesList = [
                { text: "The day you stepped into my life and made everything beautiful... ✨" },
                { text: "Your beautiful smile that instantly makes my worst days so much better. 😊" },
                { text: "Every little laugh, silly argument, and sweet memory we share. 🐼" },
                { text: "And today, celebrating another amazing year of your beautiful life! 🌸" }
            ];

            // Auto-trigger initialization process post curtain opening
            useEffect(() => {
                if (isUnlocked) {
                    const timer = setTimeout(() => {
                        setCurrentView("intro");
                        triggerConfetti();
                    }, 2400); // Gives time for split curtains to open perfectly
                    return () => clearTimeout(timer);
                }
            }, [isUnlocked]);

            const triggerConfetti = () => {
                if (typeof confetti === "function") {
                    confetti({
                        particleCount: 130,
                        spread: 80,
                        origin: { y: 0.6 },
                        colors: ['#be123c', '#e11d48', '#ffffff']
                    });
                }
            };

            const handleKeyPress = (num) => {
                if (passkey.length >= 4 || isUnlocked) return;
                const newPasskey = passkey + num;
                setPasskey(newPasskey);

                if (newPasskey.length === 4) {
                    if (newPasskey === CORRECT_PASSKEY) {
                        setTimeout(() => setIsUnlocked(true), 300);
                    } else {
                        setTimeout(() => {
                            alert("Incorrect Passkey! Click lock symbol for layout hint.");
                            setPasskey("");
                        }, 250);
                    }
                }
            };

            // React Age Counter Engine
            const AgeCounterView = () => {
                const [years, setYears] = useState(18);
                const [days, setDays] = useState(0);

                useEffect(() => {
                    const yInterval = setInterval(() => {
                        setYears(prev => (prev < 19 ? prev + 1 : prev));
                    }, 700);
                    const dInterval = setInterval(() => {
                        setDays(prev => (prev < 19 ? prev + 1 : prev));
                    }, 35);
                    return () => { clearInterval(yInterval); clearInterval(dInterval); };
                }, []);

                return (
                    <div class="w-full glass-panel rounded-3xl p-6 flex flex-col items-center justify-between min-h-[75vh] text-center react-fade-in">
                        <div></div>
                        <div class="w-full">
                            <div class="text-2xl mb-3">🎀</div>
                            <h2 class="text-xl font-semibold text-zinc-200 serif-font mb-6">Happy Birthday My Girl</h2>
                            <p class="text-[9px] tracking-[0.2em] text-zinc-500 uppercase mb-3">You have completed</p>
                            
                            <div class="grid grid-cols-3 gap-1 border-y border-zinc-900/60 py-5 my-3">
                                <div>
                                    <span class="text-3xl font-light text-red-500 block">{years}</span>
                                    <span class="text-[9px] text-zinc-500 uppercase tracking-wider mt-1 block">Years</span>
                                </div>
                                <div>
                                    <span class="text-3xl font-light text-red-500 block">0</span>
                                    <span class="text-[9px] text-zinc-500 uppercase tracking-wider mt-1 block">Months</span>
                                </div>
                                <div>
                                    <span class="text-3xl font-light text-red-500 block">{days}</span>
                                    <span class="text-[9px] text-zinc-500 uppercase tracking-wider mt-1 block">Days</span>
                                </div>
                            </div>
                        </div>
                        <button onClick={() => setCurrentView("memories")} class="w-full py-3.5 bg-zinc-950 border border-zinc-800 hover:bg-zinc-900 text-zinc-400 rounded-xl text-xs font-semibold tracking-widest uppercase transition-all active:scale-98 cursor-pointer">
                            NEXT ➔
                        </button>
                    </div>
                );
            };

            return (
                <div class="w-full max-w-sm h-full flex items-center justify-center relative">
                    
                    {/* BACKGROUND LIGHT EFFECT OVERLAYS */}
                    <div class="absolute w-[300px] h-[300px] bg-rose-950/20 rounded-full blur-[100px] -top-20 -left-20 pointer-events-none"></div>

                    {/* REACT CONTROLLED CURTAIN OVERLAY */}
                    <div class={`curtain-container ${isUnlocked ? 'curtain-opened' : ''}`}>
                        <div class="curtain-panel curtain-left"></div>
                        <div class="curtain-panel curtain-right"></div>
                    </div>

                    {/* LOCKPAD CONTROLLER VIEW */}
                    {!isUnlocked && (
                        <div class="absolute inset-0 flex items-center justify-center z-[60] react-fade-in">
                            <div class="w-full glass-panel rounded-3xl p-6 flex flex-col items-center justify-between min-h-[75vh] max-h-[85vh]">
                                <div class="text-center w-full mt-2">
                                    <div onClick={() => setShowHint(true)} class="w-16 h-16 mx-auto rounded-full border border-pink-500/30 flex items-center justify-center bg-pink-950/30 hover:border-pink-500/60 transition-colors cursor-pointer">
                                        <span class="text-xl animate-pulse">🔒</span>
                                    </div>
                                    <h2 class="text-xl font-semibold tracking-[0.2em] mt-4 uppercase text-red-500/90" style={{textShadow: "0 0 15px rgba(220,38,38,0.5)"}}>LOCKED</h2>
                                    <p class="text-[10px] text-zinc-500 mt-1 italic">Hint - Click on lock to know passkey !</p>
                                    
                                    <div class="flex justify-center gap-3 my-6">
                                        {[0, 1, 2, 3].map((index) => (
                                            <div key={index} class={`w-3 h-3 rounded-full border transition-all duration-200 ${index < passkey.length ? 'bg-red-500 border-red-500 shadow-[0_0_10px_#ef4444] scale-115' : 'border-red-500/30'}`}></div>
                                        ))}
                                    </div>
                                </div>

                                <div class="grid grid-cols-3 gap-3 w-full px-2 mb-2">
                                    {["1", "2", "3", "4", "5", "6", "7", "8", "9"].map((num) => (
                                        <button key={num} onClick={() => handleKeyPress(num)} class="key-btn text-lg font-light py-3 rounded-xl text-zinc-300 cursor-pointer">{num}</button>
                                    ))}
                                    <div></div>
                                    <button onClick={() => handleKeyPress("0")} class="key-btn text-lg font-light py-3 rounded-xl text-zinc-300 cursor-pointer">0</button>
                                    <button onClick={() => setPasskey("")} class="text-[10px] font-semibold tracking-wider text-zinc-500 hover:text-zinc-300 transition-colors active:scale-95 flex items-center justify-center cursor-pointer">CLEAR</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* HINT ELEMENT VIEW */}
                    {showHint && (
                        <div class="fixed inset-0 bg-black/85 z-[150] flex items-center justify-center p-6 react-fade-in">
                            <div class="glass-panel max-w-xs w-full rounded-2xl p-5 relative flex flex-col items-center border border-red-500/30">
                                <button onClick={() => setShowHint(false)} class="absolute top-2 right-4 text-zinc-400 hover:text-white text-2xl cursor-pointer">&times;</button>
                                <div class="w-full h-56 bg-zinc-900 rounded-xl overflow-hidden mb-4 border border-zinc-800 flex items-center justify-center text-zinc-500 text-xs text-center p-4">
                                    [ Insert Custom Photo ]
                                </div>
                                <div class="w-full text-center border-t border-zinc-800 pt-3">
                                    <span class="text-[10px] text-zinc-400 tracking-widest uppercase font-semibold">PASSKEY — 2026</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MAIN APP SECURE APPLICATION VIEWS */}
                    {isUnlocked && (
                        <div class="w-full h-full flex items-center justify-center z-10">
                            
                            {currentView === "loading" && (
                                <div class="w-full glass-panel rounded-3xl p-6 flex flex-col items-center justify-center min-h-[75vh] text-center react-fade-in">
                                    <div class="text-4xl mb-4 animate-bounce">🐼</div>
                                    <p class="text-md text-zinc-300 font-medium">Hmm</p>
                                    <p class="text-lg serif-font text-red-400/90 tracking-wide mt-2">Loading something special...</p>
                                    <span class="text-[9px] text-zinc-600 tracking-widest uppercase mt-8 block">• JUST FOR YOU •</span>
                                </div>
                            )}

                            {currentView === "intro" && (
                                <div class="w-full glass-panel rounded-3xl p-6 flex flex-col items-center justify-between min-h-[75vh] text-center react-fade-in">
                                    <div></div>
                                    <div class="flex flex-col items-center">
                                        <h1 class="text-2xl serif-font font-medium text-zinc-100 tracking-wide leading-relaxed">It's Your Special Day 🌸</h1>
                                        <div class="text-3xl my-5">🐼</div>
                                        <p class="text-xs text-zinc-400 px-4 font-light leading-relaxed">I made something special for you...</p>
                                    </div>
                                    <button onClick={() => setCurrentView("age")} class="w-full py-3.5 bg-gradient-to-r from-red-700 to-rose-700 hover:from-red-600 hover:to-rose-600 text-white rounded-xl text-xs font-semibold tracking-widest uppercase shadow-lg transition-all active:scale-98 cursor-pointer">
                                        START 🐼
                                    </button>
                                </div>
                            )}

                            {currentView === "age" && <AgeCounterView />}

                            {currentView === "memories" && (
                                <div class="w-full glass-panel rounded-3xl p-5 flex flex-col items-center justify-between min-h-[75vh] text-center react-fade-in">
                                    <div class="w-full">
                                        <h2 class="text-xl font-medium serif-font text-zinc-100 tracking-wide mt-1">Special Memories</h2>
                                        <p class="text-[9px] text-zinc-500 italic mt-0.5">Click card for next memory ✦</p>
                                    </div>
                                    <div class="w-full my-4 flex justify-center items-center h-64">
                                        <div onClick={() => {
                                            if (memoryIndex < memoriesList.length - 1) setMemoryIndex(memoryIndex + 1);
                                            else setCurrentView("letter");
                                        }} class="w-52 h-60 bg-zinc-950 rounded-2xl p-3 border border-zinc-800/80 shadow-2xl flex flex-col justify-between cursor-pointer active:scale-95 transition-transform">
                                            <div class="w-full h-40 bg-zinc-900 rounded-xl overflow-hidden flex items-center justify-center text-[10px] text-zinc-600 p-3 border border-zinc-800 text-center">
                                                [ Photo Box {memoryIndex + 1} ]
                                            </div>
                                            <div class="text-center py-1">
                                                <p class="text-[11px] text-zinc-400 italic leading-snug">{memoriesList[memoryIndex].text}</p>
                                            </div>
                                        </div>
                                    </div>
                                    <button onClick={() => setCurrentView("letter")} class="w-full py-3.5 bg-gradient-to-r from-red-800/40 to-rose-800/40 border border-red-900/30 text-red-400 rounded-xl text-xs font-semibold tracking-widest uppercase cursor-pointer">
                                        💌 ... MESSAGE
                                    </button>
                                </div>
                            )}

                            {currentView === "letter" && (
                                <div class="w-full glass-panel rounded-3xl p-6 flex flex-col items-center justify-center min-h-[75vh] text-center react-fade-in">
                                    {!letterOpened ? (
                                        <div class="flex flex-col items-center">
                                            <h2 class="text-sm tracking-[0.15em] serif-font text-zinc-400 mb-6">A LETTER, JUST FOR YOU</h2>
                                            <button onClick={() => { setLetterOpened(true); triggerConfetti(); }} class="w-16 h-16 rounded-full bg-zinc-950 border border-red-500/20 flex items-center justify-center text-xl animate-pulse hover:scale-105 active:scale-95 transition-transform cursor-pointer">
                                                ❤️
                                            </button>
                                            <p class="text-[9px] text-zinc-600 tracking-widest uppercase mt-3">Tap heart to reveal message</p>
                                        </div>
                                    ) : (
                                        <div class="w-full bg-zinc-950/80 rounded-2xl p-5 border border-zinc-800/80 text-left react-fade-in">
                                            <div class="flex justify-between items-center border-b border-zinc-900 pb-2 mb-3">
                                                <div>
                                                    <h3 class="text-xs font-semibold tracking-wider text-red-400 uppercase">Just For You ✨</h3>
                                                    <span class="text-[9px] text-zinc-600">From my heart to yours...</span>
                                                </div>
                                                <span class="text-xs">❤️</span>
                                            </div>
                                            <div class="space-y-2.5 text-[11px] text-zinc-400 leading-relaxed max-h-48 overflow-y-auto pr-1">
                                                <p class="font-semibold text-zinc-200 text-xs">Happy Birthday, Love ❤️</p>
                                                <p>You are the most beautiful part of my life, and I'm so lucky to have you. Your smile makes my days better, and your presence makes everything feel special. I hope your birthday is filled with happiness, love, and endless smiles.</p>
                                                <p>Always stay happy — because your happiness means a lot to me.</p>
                                            </div>
                                            <div class="flex gap-2 mt-4 pt-2 border-t border-zinc-900">
                                                <button onClick={triggerConfetti} class="flex-1 py-2 bg-red-800/20 hover:bg-red-800/40 text-red-400 text-[10px] font-semibold tracking-wider rounded-lg uppercase transition-all cursor-pointer">Celebrate 🎉</button>
                                                <button onClick={() => {
                                                    setIsUnlocked(false);
                                                    setPasskey("");
                                                    setCurrentView("loading");
                                                    setLetterOpened(false);
                                                    setMemoryIndex(0);
                                                }} class="py-2 px-3 bg-zinc-900 text-zinc-500 text-[10px] rounded-lg hover:text-zinc-300 transition-all cursor-pointer">Restart ↺</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>
                    )}
                </div>
            );
        }

        // Render the initialized application into target root DOM
        const root = ReactDOM.createRoot(document.getElementById('react-birthday-root'));
        root.render(<BirthdayPremiumApp />);
    </script>
</body>
</html>
